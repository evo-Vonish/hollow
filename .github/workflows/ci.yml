name: ci

on:
  push:
    branches: ["claude/new-project-setup-1dzma1", "main"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 单元测试网络无关,只需 api/ + tests/ + data/(test_middleware 导入 api.main→registry 读
          # data/engine_registry.yaml);cone 模式自动含根目录 requirements*/pytest.ini。不拉庞大 vendor/。
          sparse-checkout: |
            api
            tests
            data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      # 不设 HOLLOW_TEST_LIVE → 集成测试(若有)自动跳过,只跑网络无关单元
      - run: pytest -q
