# hollow 反向代理示例(nginx)。TLS 终止 + SSE 友好。放 /etc/nginx/sites-available/ 并软链启用。
# 关键:/v1/research?stream=true 是 SSE 长连接,nginx 默认缓冲会把事件流憋住/掐断,必须关缓冲。
server {
    listen 443 ssl;
    http2 on;
    server_name hollow.example.com;

    ssl_certificate     /etc/letsencrypt/live/hollow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hollow.example.com/privkey.pem;

    # 网关自身有在飞限流(429),这里再加一层边缘限流兜底(可选)
    # limit_req_zone $binary_remote_addr zone=hollow:10m rate=10r/s;  # 放 http{} 块

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE:关缓冲 + 长读超时,否则 research 流式事件被憋住/超时掐断
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name hollow.example.com;
    return 301 https://$host$request_uri;
}
